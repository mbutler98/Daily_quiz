<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Waypoint — Daily Lessons</title>
  <meta name="description" content="A daily, five-minute lesson in the topics you care about — AI, engineering, finance and more — with flashcards and quizzes.">
  <meta name="theme-color" content="#08142a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Waypoint">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:wght@200;300;400;500;600;700&family=Inter:wght@400;500;600&family=Michroma&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <nav id="tabbar" class="tabbar" hidden></nav>
  <div id="toasts" class="toasts" aria-live="assertive"></div>
  <div id="modal-root"></div>

  <script>
    /* Content registry. Each file in /content calls WP.addTopic(),
       WP.enrich() (extra material for lessons, keyed by lesson id) or
       WP.addFigures() (charts, animations and videos for lessons). */
    window.WP = {
      topics: [], extras: {}, figs: {},
      addTopic: function (t) { this.topics.push(t); },
      enrich: function (m) { for (var k in m) this.extras[k] = Object.assign(this.extras[k] || {}, m[k]); },
      addFigures: function (m) { for (var k in m) (this.figs[k] = this.figs[k] || []).push(m[k]); }
    };
  </script>
  <script src="content/ai.js"></script>
  <script src="content/engineering.js"></script>
  <script src="content/finance.js"></script>
  <script src="content/aerospace.js"></script>
  <script src="content/cyber.js"></script>
  <script src="content/leadership.js"></script>
  <script src="content/ddia.js"></script>
  <script src="content/banking.js"></script>
  <script src="content/economics.js"></script>
  <script src="content/politics.js"></script>
  <script src="content/regulation.js"></script>
  <script src="content/risk.js"></script>
  <script src="content/investing.js"></script>
  <script src="content/strategy.js"></script>
  <script src="content/trades.js"></script>
  <script src="content/history.js"></script>
  <script src="content/geography.js"></script>
  <script src="content/philosophy.js"></script>
  <script src="content/toronto.js"></script>
  <script src="content/sport.js"></script>
  <script src="content/extras-ai.js"></script>
  <script src="content/extras-eng.js"></script>
  <script src="content/extras-cfa.js"></script>
  <script src="content/extras-misc.js"></script>
  <script src="content/visuals.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
